<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="ChangRyong Kang — Full-Stack Engineer at goorm — terminal style">
  <defs>
    <radialGradient id="roomGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="type1"><rect x="170" y="94" width="0" height="26"><animate attributeName="width" from="0" to="85" dur="0.55s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="170" y="157" width="0" height="26"><animate attributeName="width" from="0" to="185" dur="1.2s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="type3"><rect x="170" y="295" width="0" height="26"><animate attributeName="width" from="0" to="140" dur="0.9s" begin="3.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="960" height="520" fill="#05060f"/>
  <ellipse cx="480" cy="260" rx="480" ry="300" fill="url(#roomGlow)"/>
  <g fill="#e0e7ff">
    <circle cx="70" cy="50" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="80" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="450" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="470" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 터미널 윈도우 -->
  <rect x="140" y="40" width="680" height="440" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="140" y="40" width="680" height="440" rx="12" fill="url(#scan)"/>
  <circle cx="170" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="192" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="214" cy="70" r="6" fill="#27c93f"/>
  <text x="480" y="75" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">ray@goorm — zsh</text>
  <line x1="140" y1="90" x2="820" y2="90" stroke="#21262d"/>

  <!-- $ whoami (타이핑) -->
  <text x="170" y="113" clip-path="url(#type1)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="8">whoami</tspan></text>
  <!-- 출력 -->
  <text x="170" y="138" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#e6edf3" font-weight="700">ChangRyong Kang</tspan><tspan fill="#8b949e" dx="8">· Full-Stack Engineer @ goorm</tspan><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.0s" fill="freeze"/></text>

  <!-- $ tree ~/interests (타이핑) -->
  <text x="170" y="176" clip-path="url(#type2)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="8">tree ~/interests</tspan></text>
  <!-- tree 출력 -->
  <text x="170" y="201" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#79c0ff">~/interests<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.85s" fill="freeze"/></text>
  <text x="178" y="226" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#8b949e">├──</tspan><tspan fill="#79c0ff" dx="8">herdr</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.95s" fill="freeze"/></text>
  <text x="178" y="251" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#8b949e">├──</tspan><tspan fill="#79c0ff" dx="8">claude-code</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.05s" fill="freeze"/></text>
  <text x="178" y="276" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#8b949e">└──</tspan><tspan fill="#79c0ff" dx="8">skills</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.15s" fill="freeze"/></text>

  <!-- $ npm run dev (타이핑) -->
  <text x="170" y="314" clip-path="url(#type3)" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="8">npm run dev</tspan></text>
  <!-- npm dev 서버 출력 -->
  <text x="170" y="352" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">ready in 312 ms<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.65s" fill="freeze"/></text>
  <text x="170" y="390" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7ee787">➜</tspan><tspan fill="#8b949e" dx="10">Local:</tspan><tspan fill="#c9d1d9" dx="10">http://localhost:5173/</tspan><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.9s" fill="freeze"/></text>
  <text x="170" y="415" opacity="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7ee787">➜</tspan><tspan fill="#8b949e" dx="10">Live:</tspan><tspan fill="#ffffff" font-weight="700" dx="10">https://changdragon.com/</tspan><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.15s" fill="freeze"/></text>

  <!-- 대기 프롬프트 + 깜빡이는 커서 -->
  <text x="170" y="453" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7ee787" opacity="0">$<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="5.6s" fill="freeze"/></text>
  <rect x="188" y="439" width="9" height="18" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" begin="5.6s" repeatCount="indefinite"/>
  </rect>
</svg>
